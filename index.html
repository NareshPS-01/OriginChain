    <!-- Crucial Node.js shims for crypto-browserify & readable-stream in browser -->
    <script>
      window.global = window.global || window;
      window.process = window.process || {};
      window.process.env = window.process.env || {};
      window.process.version = window.process.version || 'v18.0.0';
      window.process.browser = true;
      if (!window.process.nextTick) {
        window.process.nextTick = function(fn) { setTimeout(fn, 0); };
      }
      if (typeof window.require === 'undefined') {
        window.require = function(mod) {
          if (mod === 'node-fetch') return window.fetch;
          return {};
        };
      }
    </script>
